<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location Tracker</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background-color: #f4f4f9; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #04AA6D; color: white; border: none; border-radius: 4px; }
        #demo { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>HTML Geolocation Tracker</h2>
    <button onclick="getLocation()">Get My Location</button>
    <div id="demo"></div>

    <script>
    const x = document.getElementById("demo");
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(showPosition, showError);
        } else { x.innerHTML = "Geolocation not supported."; }
    }
    function showPosition(p) {
        x.innerHTML = "Lat: " + p.coords.latitude + "<br>Long: " + p.coords.longitude;
    }
    function showError(e) {
        x.innerHTML = "Error: " + e.message;
    }
    </script>
</body>
</html>
